  <rect x="36" y="30" width="2" height="3" rx="0.5" fill="#FFFFFF" opacity="0.9" />
  
  <rect x="18" y="28" width="2" height="3" rx="0.5" fill="#FFFFFF" opacity="0.8" />
  <rect x="18" y="34" width="2" height="3" rx="0.5" fill="#FFFFFF" opacity="0.8" />
  
